</head>

<body class="pagina-comentarios">

    <header class="menu-barra">
        <nav>
            <input type="checkbox" id="menu-toggle" class="check-toggle">
            <label for="menu-toggle" class="btn-hamburguesa">☰</label>

            <div class="enlaces-menu">
                <a href="index.html">Inicio</a>
                <a href="index.html#personajes">Personajes</a>
                <a href="index.html#universos">Universos</a>

                <a href="tienda.html">Tienda</a>
                <a href="index.html#modal-auth" class="btn-abrir-modal">Acceso</a>
            </div>

            <div class="contenedor-busqueda">
                <input type="text" placeholder="Buscar..." class="input-estetico">
            </div>
        </nav>
    </header>

    <main id="pagina">

        <section class="seccion-comentarios">
            <h2>DEJA UN COMENTARIO</h2>

            <form action="#" method="POST" class="form-comentarios">
                <div class="campo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Miles Morales" required minlength="3" maxlength="50">
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="campo">
                    <label for="comentario">Comentario:</label>
                    <textarea id="comentario" name="comentario" rows="4" placeholder="Escribe tu opinión sobre la página..." required></textarea>
                </div>

                <div class="grupo-botones">
                    <button type="submit" class="btn-enviar">Enviar comentario</button>
                    <button type="reset" class="btn-reset">Limpiar formulario</button>
                </div>
            </form>
            
            <div class="contenedor-volver">
                <a href="index.html" class="btn-volver">VOLVER AL INICIO</a>
            </div>
        </section>

    </main>
